<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホワイトアウトサバイバル　建造計算ツール</title>

<style>
:root {
  --bg-night: #020617;
  --bg-ice: #0f2746;
  --panel: rgba(7, 18, 34, 0.72);
  --panel-strong: rgba(8, 24, 45, 0.88);
  --line: rgba(135, 211, 255, 0.22);
  --line-strong: rgba(56, 189, 248, 0.56);
  --text: #f4f8ff;
  --muted: #a8c4e6;
  --gold: #f8e6b0;
  --accent: #22d3ee;
  --accent-2: #60a5fa;
  --danger: #fb7185;
}

* { box-sizing: border-box; }

body {
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  padding: 24px 16px;
  max-width: 900px;
  margin: 0 auto;
  color: var(--text);
  min-height: 100vh;
  background:
    radial-gradient(680px 360px at 15% -8%, rgba(34, 211, 238, 0.28), transparent 64%),
    radial-gradient(900px 520px at 92% 4%, rgba(59, 130, 246, 0.26), transparent 60%),
    radial-gradient(680px 460px at 50% 105%, rgba(248, 230, 176, 0.13), transparent 60%),
    linear-gradient(145deg, rgba(2, 6, 23, 0.78), rgba(5, 14, 31, 0.94)),
    url("https://www.whiteoutsurvival.com/wp-content/uploads/2024/01/kv-pc.jpg") center top/cover fixed no-repeat,
    linear-gradient(170deg, var(--bg-night) 0%, #071629 48%, var(--bg-ice) 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 72%);
}

.app-shell {
  position: relative;
  padding: 2px;
}

.app-shell::before {
  content: "";
  position: absolute;
  inset: -10px;
  border: 1px solid rgba(125, 211, 252, 0.22);
  border-radius: 26px;
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), transparent 30%, rgba(248, 230, 176, 0.09));
  pointer-events: none;
  z-index: -1;
}

.header {
  position: relative;
  overflow: hidden;
  margin-bottom: 18px;
  padding: 18px 18px 20px;
  border-radius: 22px;
  border: 1px solid var(--line-strong);
  background:
    linear-gradient(145deg, rgba(14, 39, 67, 0.62), rgba(4, 13, 28, 0.92)),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 12px);
  box-shadow:
    0 22px 60px rgba(0, 0, 0, 0.42),
    0 0 36px rgba(34, 211, 238, 0.13),
    inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
}
.hero-visual{
  margin-top: 12px;
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid rgba(172, 211, 252, 0.38);
  background: linear-gradient(135deg, rgba(17,34,58,0.88), rgba(11,22,40,0.64));
  backdrop-filter: blur(2px);
}
.hero-logo{
  width: 100%;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 10px 20px rgba(0,0,0,.25);
}
.hero-copy{
  font-size: 12px;
  line-height: 1.6;
  color: #dcebff;
}
.hero-copy strong{
  color: var(--gold);
}

.header::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(118deg, rgba(3, 9, 22, 0.96) 18%, rgba(5, 18, 36, 0.70) 70%, rgba(3, 9, 22, 0.97) 100%),
    url("https://www.whiteoutsurvival.com/wp-content/uploads/2024/01/kv-pc.jpg") center 30%/cover no-repeat;
  z-index: 0;
  opacity: 0.96;
}

.header > * {
  position: relative;
  z-index: 1;
}

.badge {
  display: inline-block;
  margin-bottom: 8px;
  padding: 5px 10px;
  font-size: 10px;
  letter-spacing: 0.08em;
  border-radius: 999px;
  color: #061827;
  background: linear-gradient(135deg, #67e8f9, #f8e6b0);
  font-weight: 800;
  box-shadow: 0 0 18px rgba(34, 211, 238, 0.28);
}

.title {
  font-size: clamp(22px, 4.5vw, 34px);
  font-weight: 800;
  letter-spacing: 0.03em;
  color: #f8fbff;
  text-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
}

.meta {
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}

.meta a, .footer a { color: #67e8f9; text-decoration: none; }
.official-strip{
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.official-chip{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 7px;
  border-radius: 999px;
  border: 1px solid rgba(172, 211, 252, 0.42);
  background: rgba(8, 22, 40, 0.7);
  font-size: 10px;
  color: #d6e8ff;
}
.official-chip img{
  width: 13px;
  height: 13px;
  object-fit: contain;
}

.release-note {
  margin-top: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  border: 1px solid rgba(255, 225, 164, 0.35);
  background: linear-gradient(145deg, rgba(10, 22, 40, 0.82), rgba(22, 39, 63, 0.65));
  font-size: 11px;
  color: #d6e8ff;
  line-height: 1.5;
}
.release-note strong {
  color: var(--gold);
}
.body-watermark {
  position: fixed;
  left: 14px;
  bottom: 14px;
  width: 110px;
  opacity: 0.16;
  pointer-events: none;
  filter: drop-shadow(0 0 8px rgba(162, 210, 255, 0.5));
}

.section, table, .card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background:
    linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
    linear-gradient(165deg, var(--panel), rgba(10, 28, 51, 0.78));
  box-shadow:
    0 18px 44px rgba(0, 0, 0, 0.34),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 26px rgba(34, 211, 238, 0.035);
  backdrop-filter: blur(14px);
}

table { width: 100%; border-collapse: collapse; margin-bottom: 12px; overflow: hidden; }

th, td {
  border-bottom: 1px solid rgba(157, 186, 220, 0.16);
  padding: 10px 7px;
  font-size: 13px;
}

th {
  color: #bff7ff;
  background: linear-gradient(180deg, rgba(34, 211, 238, 0.15), rgba(34, 211, 238, 0.035));
  font-weight: 700;
}

select, input, textarea {
  width: 100%;
  padding: 11px 12px;
  margin-top: 4px;
  margin-bottom: 6px;
  font-size: 15px;
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.32);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  outline: none;
  transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

select:focus, input:focus, textarea:focus {
  border-color: rgba(34, 211, 238, 0.8);
  background: rgba(3, 12, 26, 0.68);
  box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12), inset 0 1px 0 rgba(255,255,255,0.05);
}

select {
  background-color: #0b1628;
  color: var(--text);
}

select option {
  color: #0d1a2d;
  background-color: #ffffff;
}

input::placeholder { color: #7f98bc; }
label { font-size: 12px; color: #cedef4; }

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(34, 211, 238, 0.68);
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(59, 130, 246, 0.18));
  color: #bff7ff;
  font-size: 14px;
  font-weight: 700;
  text-shadow: 0 0 10px rgba(34, 211, 238, 0.34);
  cursor: pointer;
  box-shadow: 0 0 18px rgba(34, 211, 238, 0.10), inset 0 1px 0 rgba(255,255,255,0.07);
  transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
}

button:hover { filter: brightness(1.12); box-shadow: 0 8px 22px rgba(34, 211, 238, 0.20), inset 0 1px 0 rgba(255,255,255,0.1); transform: translateY(-1px); }
button:active { transform: translateY(1px); }

.action-main {
  border-color: rgba(103, 232, 249, 0.95);
  background: linear-gradient(135deg, #22d3ee 0%, #2563eb 100%);
  color: #03111f;
  text-shadow: none;
  box-shadow: 0 14px 34px rgba(37, 99, 235, 0.30), 0 0 24px rgba(34, 211, 238, 0.20);
}

td button {
  padding: 8px 0;
  background: linear-gradient(135deg, rgba(251, 113, 133, 0.22), rgba(190, 18, 60, 0.28));
  border-color: rgba(251, 113, 133, 0.75);
  color: #fecdd3;
}

.section { padding: 16px; margin: 14px 0; }
.group-title { font-size: 14px; color: #bff7ff; font-weight: 800; margin-bottom: 10px; letter-spacing: 0.04em; text-shadow: 0 0 14px rgba(34, 211, 238, 0.22); }

.buff-buttons { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.buff-buttons button { flex: 1; min-width: 60px; padding: 8px; font-size: 12px; }

.switch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.switch {
  background: rgba(0, 0, 0, 0.24);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 10px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #dde9fb;
}
.switch-label {
  white-space: nowrap;
  word-break: keep-all;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.info { font-size: 11px; color: var(--accent); margin-bottom: 6px; }
.result { display: grid; gap: 12px; margin-top: 12px; }
.card { padding: 16px; }

.time {
  font-size: clamp(28px, 8vw, 42px);
  text-align: center;
  font-weight: 800;
  color: #ecfeff;
  text-shadow: 0 0 22px rgba(34, 211, 238, 0.48);
}

.resources { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
.resource-row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: rgba(0, 0, 0, 0.18); }
.resource-icon { width: 22px; height: 22px; object-fit: contain; border-radius: 6px; filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.18)); }
textarea { height: 110px; }

.footer {
  text-align: center;
  font-size: 11px;
  color: #89a3c6;
  margin: 14px 0 8px;
}

.app-shell::after {
  content: "";
  position: fixed;
  right: 16px;
  bottom: 16px;
  width: 120px;
  height: 120px;
  background: url("https://gom-s3-user-avatar.s3.us-west-2.amazonaws.com/wp-content/uploads/2023/07/item_icon_100081.png") center/contain no-repeat;
  opacity: 0.14;
  pointer-events: none;
  filter: drop-shadow(0 0 8px rgba(162, 210, 255, 0.5));
}

@media (max-width: 640px) {
  body { padding: 10px; }
  .switch-grid, .resources { grid-template-columns: 1fr; }
  .title { font-size: 19px; }
  .hero-visual{ grid-template-columns: 1fr; }
  .hero-logo{ max-width: 120px; }
}
</style>
</head>

<body>
<div class="app-shell">

<div class="header">
  <div class="badge">UNOFFICIAL FAN TOOL</div>
  <div class="title">ホワイトアウトサバイバル　建造計算ツール</div>
  <div class="meta">
    Version 1.2.5 |
    <a href="history.html">改訂履歴</a>
  </div>
  <div class="meta">入力内容は自動保存されます。構成保存・共有キーは建物/レベルに加えてバフ設定も含みます。</div>
</div>
<img class="body-watermark" src="https://gom-s3-user-avatar.s3.us-west-2.amazonaws.com/wp-content/uploads/2023/07/item_icon_100081.png" alt="Whiteout Survival watermark">

<table>
<thead>
<tr>
<th>建物</th><th>開始</th><th>終了</th><th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<button class="action-main" onclick="addRow()">＋追加</button>

<!-- 建造速度 -->
<div class="section">
<div class="group-title">建造速度バフ</div>

<label>基礎建造バフ(%) ※研究,島,ジンマンスキル,VIP,ステーションを含む</label>
<input id="baseBuff" type="number" value="80" step="0.1">

<div class="buff-buttons">
  <button onclick="adjustBuff(-10)">-10</button>
  <button onclick="adjustBuff(-1)">-1</button>
  <button onclick="adjustBuff(-0.1)">-0.1</button>
  <button onclick="adjustBuff(0.1)">+0.1</button>
  <button onclick="adjustBuff(1)">+1</button>
  <button onclick="adjustBuff(10)">+10</button>
</div>

<label>ハイエナスキル</label>
<select id="pet"></select>
<div id="petInfo" class="info"></div>

<label>副執政官</label>
<select id="sub">
<option value="0">なし</option>
<option value="10">+10%</option>
<option value="15">+15%</option>
</select>

<div class="switch-grid">
  <div class="switch">
    <span class="switch-label">領主司令</span>
    <input type="checkbox" id="lord">
  </div>
  <div class="switch">
    <span class="switch-label">執政官スキル</span>
    <input type="checkbox" id="gov">
  </div>
</div>

<label>アグネススキル</label>
<select id="agnes"></select>
<div id="agnesInfo" class="info"></div>

</div>

<!-- 資源 -->
<div class="section">
<div class="group-title">資源消費バフ</div>

<label>ジンマンスキル</label>
<select id="jinman"></select>
<div id="jinmanInfo" class="info"></div>

</div>

<button class="action-main" onclick="calc()">計算</button>

<div class="result">

<div class="card">
<div class="time" id="result">--</div>
</div>

<div class="card resources" id="detail"></div>

<div class="card">
<button onclick="copyResult()">📋 コピー（ゲームチャット用）</button>
<textarea id="copyText" readonly></textarea>
</div>

</div>

<div class="section">
  <div class="group-title">構成の保存・共有</div>

  <label>保存済み構成</label>
  <select id="presetSelect"></select>

  <label>構成名</label>
  <input id="presetName" type="text">

  <div class="buff-buttons">
    <button id="createPresetBtn" type="button">新規作成</button>
    <button id="savePresetBtn" type="button">上書き保存</button>
    <button id="deletePresetBtn" type="button">削除</button>
  </div>

  <label>共有用ユニークキー</label>
  <input id="shareKey" type="text" readonly placeholder="キー生成後に表示">

  <div class="buff-buttons">
    <button id="generateKeyBtn" type="button">キー生成</button>
    <button id="copyKeyBtn" type="button">キーをコピー</button>
  </div>

  <label>復元キー入力</label>
  <input id="restoreKey" type="text" placeholder="受け取ったキーを貼り付け">
  <div class="buff-buttons">
    <button id="restoreKeyBtn" type="button">キーから復元</button>
  </div>
</div>

<div class="footer">
© #3352 ヒゲのアニキ
</div>

<script src="app.js"></script>

</div>
</body>
</html>
